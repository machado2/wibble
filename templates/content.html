{% extends "base.html" %}

{% block content %}
<article>
  {% if not is_published %}<p class="draft-note">Draft</p>{% endif %}
  <h1>{{ title }}</h1>
  <time>{{ created_at }}</time>
  {{ body | safe }}
  {% if is_admin %}
  <nav class="admin-actions">
    <a href="{{ locale_prefix }}/content/{{ slug }}/edit">Edit</a>
    <a href="{{ locale_prefix }}/admin/articles">Admin</a>
  </nav>
  {% endif %}
</article>
{% endblock content %}
