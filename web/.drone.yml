kind: pipeline
type: docker
name: default

steps:
- name: build
  image: docker:dind
  volumes:
  - name: dockersock
    path: /var/run/docker.sock
  commands:
  - docker build -t ${DOCKER_REGISTRY}/wibble-web:${DRONE_COMMIT_SHA} .
  - docker push ${DOCKER_REGISTRY}/wibble-web:${DRONE_COMMIT_SHA}

volumes:
- name: dockersock
  host:
    path: /var/run/docker.sock